# Starship prompt configuration
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for commands executed by starship (in milliseconds)
command_timeout = 1000

# Format string
format = """
$character\
$os$hostname\
$directory\
$git_branch\
$git_status \
$python\
$aws\
$golang\
$java\
$nodejs\
$rust\
$elixir\
$elm\
$erlang\
$ruby\
$kotlin\
$gradle\
$scala\
$dart\
$conda\
$pijul_channel\
$lua\
$rlang\
$php\
$package\
$buf\
$memory_usage\
$kubernetes\
$docker_context\
[](#1C3A5E)$time[ ](#1C3A5E)$cmd_duration
[└─>](bold green) """

# Wait 10 milliseconds for starship to check files under the current directory
scan_timeout = 10

# Disable the blank line at the start of the prompt
add_newline = true
continuation_prompt = '▶▶ '

[username]
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "on [$hostname](bold yellow) "
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = true
format = "at [$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "🏳"
ahead = "🏎💨${count}"
behind = "😰${count}"
diverged = "😵${ahead_count}⇣${behind_count}"
untracked = "🤷${count}"
stashed = "$${count}"
modified = "📝${count}"
staged = '[++\($count\)](green)'
renamed = "»${count}"
deleted = "🗑${count}"

[python]
symbol = " "
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold green"

[rust]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold red"

[golang]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold cyan"

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "
style = "bold blue"

[time]
disabled = false
format = '🕙[\[ $time \]]($style) '
time_format = "%T"
style = "bold white"

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red) '

[package]
disabled = true

[cmd_duration]
min_time = 5000
format = 'underwent [$duration](bold yellow)'

[aws]
disabled = true

[azure]
format = 'on [$symbol($subscription)]($style) '
disabled = true

[gcloud]
disabled = true

